<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MatchManager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('tournaments.index') }}">MatchManager</a>
    <nav aria-label="Navegação principal">
      <a href="{{ url_for('tournaments.index') }}"{% if request.blueprint in ('tournaments', 'registrations') %} aria-current="page"{% endif %}>Torneios</a>
      <a href="{{ url_for('teams.index') }}"{% if request.blueprint == 'teams' %} aria-current="page"{% endif %}>Equipes</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
