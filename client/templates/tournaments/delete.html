{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Excluir torneio</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    <p>Excluir “{{ tournament.name }}” e suas inscrições e partidas?</p>
    <button type="submit" name="confirmed" value="yes">Confirmar exclusão</button>
    <a href="{{ url_for('tournaments.detail', tournament_id=tournament.id) }}">Cancelar</a>
  </form>
</section>
{% endblock %}
