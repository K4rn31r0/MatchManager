{% extends "base.html" %}
{% block title %}Editar {{ tournament.name }} · MatchManager{% endblock %}
{% block content %}
<p class="breadcrumb"><a href="{{ url_for('tournaments.detail', tournament_id=tournament.id) }}">← {{ tournament.name }}</a></p>
<section class="card">
  <h1>Editar torneio</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    {% include 'tournaments/_fields.html' %}
    <button type="submit">Salvar alterações</button>
    <a class="button button-secondary" href="{{ url_for('tournaments.detail', tournament_id=tournament.id) }}">Cancelar</a>
  </form>
</section>
{% endblock %}
